<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyword Generator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #f4f7fb;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .generator-box {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1d2939;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 24px;
    }

    .form-label {
      font-weight: 600;
      color: #344054;
    }

    textarea {
      resize: none;
      border-radius: 16px !important;
      padding: 16px !important;
      border: 1px solid #d0d5dd !important;
      min-height: 180px;
    }

    textarea:focus {
      box-shadow: 0 0 0 4px rgba(13,110,253,0.12) !important;
      border-color: #0d6efd !important;
    }

    .btn {
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 600;
    }

    .output-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      min-height: 120px;
      padding: 18px;
      color: #0f172a;
      font-size: 16px;
      white-space: pre-wrap;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }

    .custom-toast {
      background: #111827;
      color: white;
      padding: 14px 18px;
      border-radius: 14px;
      min-width: 220px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      font-weight: 500;
    }

    .custom-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .helper {
      font-size: 13px;
      color: #667085;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="generator-box">
    <div class="title">Keyword Generator</div>
    <div class="subtitle">
      Semua tanda <b>#</b> akan otomatis diganti menggunakan 1 kata yang sama dari list.
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label">Input List Kata</label>
        <textarea id="wordList" class="form-control" placeholder="apel&#10;mangga&#10;pisang"></textarea>
        <div class="helper">1 baris = 1 kata</div>
      </div>

      <div class="col-md-6">
        <label class="form-label">Template Kalimat</label>
        <textarea id="templateText" class="form-control" placeholder="Saya makan @ lalu @ dan membeli @"></textarea>
        <div class="helper">Gunakan tanda # sebagai placeholder</div>
      </div>
    </div>

    <div class="d-flex gap-3 mt-4 flex-wrap">
      <button class="btn btn-primary" onclick="generateText()">Get Result</button>
      <button class="btn btn-outline-secondary" onclick="copyResult()">Copy Result</button>
    </div>

    <div class="mt-4">
      <label class="form-label">Output</label>
      <div class="output-box" id="outputText">Hasil akan muncul di sini...</div>
    </div>
  </div>

  <div class="toast-container">
    <div id="toast" class="custom-toast">Copy success</div>
  </div>

  <script>
    function generateText() {
      const wordInput = document.getElementById('wordList');
      const templateInput = document.getElementById('templateText');
      const output = document.getElementById('outputText');

      let words = wordInput.value
        .split('\n')
        .map(item => item.trim())
        .filter(item => item !== '');

      let template = templateInput.value;

      if (words.length === 0) {
        output.textContent = 'List kata kosong.';
        return;
      }

      if (!template.includes('@')) {
        output.textContent = 'Tidak ada tanda @ pada template.';
        return;
      }

      // Ambil 1 kata pertama
      const currentWord = words.shift();

      // Ganti SEMUA # dengan kata yang sama
      const result = template.replace(/@/g, currentWord);

      output.textContent = result;

      // Update list kata tersisa
      wordInput.value = words.join('\n');
    }

    function copyResult() {
      const text = document.getElementById('outputText').textContent;

      if (!text || text === 'Hasil akan muncul di sini...') {
        return;
      }

      navigator.clipboard.writeText(text);

      showToast('Copy success');
    }

    function resetAll() {
      document.getElementById('wordList').value = '';
      document.getElementById('templateText').value = '';
      document.getElementById('outputText').textContent = 'Hasil akan muncul di sini...';
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }
  </script>

</body>
</html>
